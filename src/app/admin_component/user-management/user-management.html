<h3>User Management</h3>
<table class="admin-table">
  <thead>
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th>Role</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td><span class="role-badge" [ngClass]="user.role">{{ user.role }}</span></td>
      <td>
        <button class="btn-secondary" (click)="toggleRole(user)">
          Make {{ user.role === 'admin' ? 'User' : 'Admin' }}
        </button>
      </td>
    </tr>
  </tbody>
</table>

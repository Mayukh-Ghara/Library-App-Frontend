<div class="admin-container">
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <button [class.active]="activeTab === 'users'" (click)="switchTab('users')">Manage Users</button>
    <button [class.active]="activeTab === 'addBook'" (click)="switchTab('addBook')">Add New Book</button>
    <button [class.active]="activeTab === 'inventory'" (click)="switchTab('inventory')">Manage Inventory</button>

    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>

  <div class="content">
    <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>

    <app-user-management 
      *ngIf="activeTab === 'users'" 
      [users]="users" 
      (roleChanged)="onToggleRole($event)">
    </app-user-management>

    <app-add-book 
      *ngIf="activeTab === 'addBook'" 
      (bookAdded)="onBookAdded($event)">
    </app-add-book>

    <app-inventory-management 
      *ngIf="activeTab === 'inventory'" 
      [books]="books" 
      (copiesAdjusted)="onUpdateCopies($event)">
    </app-inventory-management>
  </div>
</div>

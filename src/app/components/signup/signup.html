<div class="page-wrapper">
  <div class="signup-container">
    <h2>Create an Account</h2>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form class="signup-form" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" placeholder="Choose a username">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="Create a password">
        <small class="helper-text">Must be at least 6 characters.</small>
      </div>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" formControlName="firstName" placeholder="First Name">
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" formControlName="lastName" placeholder="Last Name">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number (Optional)</label>
        <input type="tel" id="phone" formControlName="phone" placeholder="Phone Number">
      </div>

      <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
    </form>

    <p class="login-text">Already have an account? <a routerLink="/login">Log in here</a></p>
  </div>
</div>
